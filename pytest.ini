[pytest]
# 为什么必须有本文件：不带它跑 `pytest src` 会在收集阶段挂死（实测 20 分钟无输出，
# 连 --collect-only 也超时）；有它则收集 347 项耗时 0.6 秒、全量回归 8 分钟跑完。
#
# 挂死的根源是 src/ 下混有非 B 题脚本在模块级执行重活，例如 src/c_q1.py 第 55 行
# 直接 pd.read_excel(...) 并往下算，没有 if __name__ 保护。
# 逐项二分显示起效的是下面 python_files 这一行；它与 pytest 默认值相同，
# 所以真正生效的是「存在 inifile」本身（据此锚定 rootdir 与收集根）。
# 机制未再深挖，但现象可复现：删掉本文件回归立刻挂死。
python_files = test_*.py

# 只在真正含测试的目录收集。src/ 下另有 140+ 个实验脚本，不是测试模块。
testpaths =
    src/b_sim
    src/b_eval
    src

norecursedirs = .git __pycache__ results logs official_runs dist_windows paper problem figures state supporting experiments
