[pytest]
# 不带本文件时 `pytest src` 在收集阶段挂住（实测 20 分钟无输出、--collect-only 也超时）；
# 加上本文件后收集 316 项耗时 0.2 s。逐项二分确认起效的是 python_files 这一行，
# 它与 pytest 默认值相同，故真正机制是「存在 inifile 从而锚定 rootdir」，
# 而非该值本身 —— 机制未进一步定论，但现象可复现，不要删本文件。
python_files = test_*.py

# 只在真正含测试的目录里收集。src/ 下另有 140+ 个实验脚本，不应被当作测试模块。
testpaths =
    src/b_sim
    src/b_eval
    src

norecursedirs = .git __pycache__ results logs official_runs dist_windows paper problem figures state supporting experiments
